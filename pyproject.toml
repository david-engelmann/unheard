[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unheard"
version = "0.1.0"
description = "Obedience scoring for standing instructions, counts over impressions"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
unheard = "unheard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
