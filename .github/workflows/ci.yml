name: ci
on:
  push:
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Codepoint scan
        run: python3 scripts/codepoint_scan.py
      - name: Tests
        run: |
          if [ -d tests ]; then python3 -m pip install pytest -q && python3 -m pytest tests -q; else echo "no tests yet, the documented gate is the codepoint scan until the first build act"; fi
